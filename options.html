<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-NEXT AV Info 設定</title>
<style>body{font:16px/1.7 system-ui,-apple-system,sans-serif;max-width:670px;margin:40px auto;padding:0 20px;color:#222}h1{font-size:25px}fieldset{border:1px solid #ccc;border-radius:9px;padding:20px}label{display:block;margin:10px 0;cursor:pointer}input{margin-right:9px}p{margin:12px 0;color:#555}.warning{color:#a52c26;font-weight:700}#status{min-height:1.5em;color:#176341}</style>
</head><body><h1>U-NEXT AV Info 設定</h1>
<fieldset><legend>作品詳細ページでの解析</legend>
<label><input type="radio" name="mode" value="safe">作品ページではカードを表示しない（推奨）</label>
<label><input type="radio" name="mode" value="allow">視聴履歴への追加を許容して、作品ページで自動解析する</label>
<p class="warning">自動解析では、動画を再生しなくてもU-NEXTの視聴履歴へ追加される可能性が高いです。</p>
<p>どちらの設定でも、再生ページには「現在の品質」と、再生プレイヤーから取得可能な「最高品質」を表示します。最高品質が確認できない場合は「取得不可」と表示します。</p>
</fieldset><p id="status" role="status"></p><script src="options.js"></script></body></html>
