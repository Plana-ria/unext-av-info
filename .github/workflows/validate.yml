name: Extension checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Validate manifests
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['manifest.json', 'manifest.firefox.json'];
          const manifests = files.map(file => JSON.parse(fs.readFileSync(file, 'utf8')));

          for (const [index, manifest] of manifests.entries()) {
            if (manifest.manifest_version !== 3 ||
                !/^\d+\.\d+\.\d+$/.test(manifest.version)) {
              throw Error(files[index] + ' invalid manifest');
            }
          }

          if (manifests[0].version !== manifests[1].version) {
            throw Error('Manifest versions do not match');
          }
          if (manifests[0].background.scripts) {
            throw Error('Chromium manifest contains background.scripts');
          }
          if (!manifests[1].background.scripts) {
            throw Error('Firefox manifest lacks background scripts');
          }
          NODE
